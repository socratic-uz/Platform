<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Socratic Platform</title>
    <base href="/" />

    <!-- Preconnect & Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Material Web Components Bundle -->
    <script src="_content/Material.Web/material-web.bundle.js" defer></script>

    <style>
        :root {
            --md-ref-typeface-brand: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --md-ref-typeface-plain: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --md-icon-font: 'Material Symbols Outlined';
            --md-icon-size: 24px;
        }
        html, body {
            font-family: var(--md-ref-typeface-plain);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
        }
        md-icon,
        .material-symbols-outlined,
        [class*="material-symbols"] {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: var(--md-icon-size, 24px);
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-grid;
            place-items: center;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            width: var(--md-icon-size, 24px);
            height: var(--md-icon-size, 24px);
            vertical-align: middle;
        }
        md-icon:not(:defined) {
            display: inline-grid;
            place-items: center;
            width: var(--md-icon-size, 24px);
            height: var(--md-icon-size, 24px);
            overflow: hidden;
            font-family: 'Material Symbols Outlined' !important;
            vertical-align: middle;
        }
        md-dialog:not(:defined) {
            display: none !important;
        }
    </style>

    <link rel="stylesheet" href="_content/Layout/css/fonts.css" />
    <link rel="stylesheet" href="_content/Layout/css/font-styles.css" />
    <link rel="stylesheet" href="_content/Layout/css/touch.css" />
    <link rel="stylesheet" href="_content/Layout/css/grid.css" />
    <link rel="stylesheet" href="_content/Layout/css/material-theme.css/dark.css" />
    <link rel="stylesheet" href="_content/Layout/css/effects/liquid-glass.css" />
    <link rel="stylesheet" href="_content/Layout/Layout.styles.css" />
    <link rel="stylesheet" href="_content/Chat/Chat.styles.css" />
    <link rel="stylesheet" href="Native.UI.styles.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="_content/Layout/img/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="_content/Layout/img/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="_content/Layout/img/icon-192.png" />
</head>

<body oncontextmenu="return false;">

    <script src="_content/Layout/js/passkeyHelper.js"></script>
    <script src="_content/Layout/js/telegramHelper.js"></script>
    <script src="_content/Layout/js/oauthPopupHelper.js"></script>
    <script src="_content/Layout/js/touchSwipeHelper.js"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script type="module" src="_content/Layout/lib/app.js"></script>

</body>

</html>
